<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farmda - 식물을 키우고 기록하기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/enhancements.css') }}">
</head>
<body>
  <main class="shell">
    <header class="site-title"><h1>Farmda - 식물을 키우고 기록하기</h1></header>
    <section class="showcase">
      <div class="frame">
        <i class="tl"></i><i class="br"></i>
        <div class="plant" role="img" aria-label="밝은 배경의 초록 식물"></div>
        <div class="thumbs" aria-label="식물 사진 선택">
          <button class="active" type="button" data-image="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&amp;fit=crop&amp;w=1600&amp;q=90" aria-label="고무나무 사진 보기"></button>
          <button type="button" data-image="https://images.unsplash.com/photo-1485955900006-10f4d324d411?auto=format&amp;fit=crop&amp;w=1600&amp;q=90" aria-label="화분 식물 사진 보기"></button>
          <button type="button" data-image="https://images.unsplash.com/photo-1459411621453-7b03977f4bfc?auto=format&amp;fit=crop&amp;w=1600&amp;q=90" aria-label="초록 식물 사진 보기"></button>
        </div>
      </div>
    </section>
    <section class="auth">
      <div class="auth-box">
        <nav class="tabs" aria-label="계정 메뉴">
          <button class="tab active" type="button" data-view="login">로그인</button>
          <button class="tab" type="button" data-view="signup">회원가입</button>
        </nav>
        <article class="view active" id="login">
          <h2>Welcome<br>back.</h2>
          <p class="copy">Farmda에 다시 오신 것을 환영합니다.<br>계정 정보를 입력해 주세요.</p>
          <a class="google-login" href="{{ url_for('auth.google_login', next=request.args.get('next')) }}">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.91h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.4Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.37l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.13H3.06v2.62A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.92A6 6 0 0 1 6.08 12c0-.67.11-1.32.32-1.92V7.46H3.06A10 10 0 0 0 2 12c0 1.61.39 3.14 1.06 4.54l3.34-2.62Z"/><path fill="#EA4335" d="M12 5.95c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.62 9.62 0 0 0 12 2a10 10 0 0 0-8.94 5.46l3.34 2.62c.79-2.37 3-4.13 5.6-4.13Z"/></svg>
            <span>Google로 계속하기</span>
          </a>
          <div class="auth-divider"><span>또는 이메일로 로그인</span></div>
          <form id="login-form">
            <label>EMAIL ADDRESS<input name="email" type="email" placeholder="name@example.com" autocomplete="email" required></label>
            <label>PASSWORD<input name="password" type="password" placeholder="••••••••" minlength="8" maxlength="128" autocomplete="current-password" required></label>
            <div class="options">
              <label class="check"><input name="remember" type="checkbox"> 로그인 유지</label>
              <button type="button" class="link">비밀번호 찾기</button>
            </div>
            <button class="submit" type="submit"><span>로그인하기</span><b>→</b></button>
          </form>
          <p class="switch">아직 계정이 없나요? <button type="button" data-switch="signup">회원가입</button></p>
        </article>
        <article class="view" id="signup">
          <h2>Join<br>Farmda.</h2>
          <p class="copy">식물을 키우고 기록하기 위한 계정을 만들어 보세요.</p>
          <a class="google-login" href="{{ url_for('auth.google_login') }}">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.91h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.4Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.37l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.13H3.06v2.62A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.92A6 6 0 0 1 6.08 12c0-.67.11-1.32.32-1.92V7.46H3.06A10 10 0 0 0 2 12c0 1.61.39 3.14 1.06 4.54l3.34-2.62Z"/><path fill="#EA4335" d="M12 5.95c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.62 9.62 0 0 0 12 2a10 10 0 0 0-8.94 5.46l3.34 2.62c.79-2.37 3-4.13 5.6-4.13Z"/></svg>
            <span>Google로 가입하기</span>
          </a>
          <div class="auth-divider"><span>또는 이메일로 가입</span></div>
          <form id="signup-form">
            <label>DISPLAY NAME<input name="nickname" type="text" placeholder="이름" minlength="2" maxlength="50" autocomplete="nickname" required></label>
            <label>EMAIL ADDRESS<input name="email" type="email" placeholder="name@example.com" autocomplete="email" required></label>
            <label>PASSWORD<input name="password" type="password" placeholder="8자 이상 입력" minlength="8" maxlength="128" autocomplete="new-password" required></label>
            <label class="check"><input type="checkbox" required> 이용약관 및 개인정보 처리방침 동의</label>
            <button class="submit" type="submit"><span>계정 생성하기</span><b>→</b></button>
          </form>
          <p class="switch">이미 계정이 있나요? <button type="button" data-switch="login">로그인</button></p>
        </article>
      </div>
      <footer>FARMDA / GROW AND SHARE</footer>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/script.js') }}?v=4"></script>
</body>
</html>
