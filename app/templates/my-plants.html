<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farmda - 내가 키우고 있는 식물</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/my-plants.css?v=1">
</head>
<body>
  <main class="plants-dashboard">
    <header>
      <div><a href="welcome.html">🌱 Farmda</a><p>MY GREEN SPACE</p><h1>내가 키우고 있는 식물</h1><span>함께 자라고 있는 식물들의 상태를 확인해보세요.</span></div>
      <a class="add-plant" href="plant-select.html">＋ 새로운 식물 키우기</a>
    </header>
    <section class="summary" aria-label="식물 요약">
      <div><small>함께하는 식물</small><strong id="plant-count">0</strong></div>
      <div><small>오늘 돌봄 필요</small><strong id="care-count">0</strong></div>
      <div><small>꽃 피운 식물</small><strong id="bloom-count">0</strong></div>
    </section>
    <section class="plant-list" id="my-plant-list" aria-live="polite"></section>
    <section class="empty-plants" id="empty-plants" hidden><span>🌰</span><h2>아직 키우는 식물이 없어요</h2><p>마음을 담아 키울 첫 식물을 골라보세요.</p><a href="plant-select.html">첫 식물 고르기</a></section>
  </main>
  <script src="../js/my-plants.js?v=1"></script>
</body>
</html>
