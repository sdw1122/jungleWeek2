<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmda 상태창</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/dashboard.css"></head><body>
<link rel="stylesheet" href="../css/dashboard-fixes.css?v=3"><link rel="stylesheet" href="../css/growth-stages.css?v=3"><main class="dashboard">
  <aside class="status-panel"><h1>🌱 <span>상태창</span></h1><section class="plant-chip"><div class="mini-seed" id="mini-stage">🌰</div><div><h2>씨앗</h2><p id="stage-label">씨앗 단계</p></div></section><section class="energy-card"><h3>⚡ 에너지 상태</h3><div class="energy-title"><b>전체 성장 에너지</b><b><span id="total">0</span> / 100</b></div><div class="progress gray"><i id="total-bar"></i></div><p class="next">다음 진화까지: <b id="next">5</b></p><hr><div class="energy-title pink"><b>💖 긍정 에너지</b><b id="positive">0</b></div><div class="progress soft-pink"><i id="positive-bar"></i></div><div class="energy-title purple"><b>🌧️ 부정 에너지</b><b id="negative">0</b></div><div class="progress soft-purple"><i id="negative-bar"></i></div></section><section class="mood"><h3>현재 식물의 기분/성향</h3><p id="mood-copy">아직 싹을 틔우기 전입니다. 버튼을 눌러 돌봐주세요!</p></section></aside>
  <section class="garden"><h2 id="plant-name">식물</h2><div class="stage-plant" id="seed" aria-live="polite">🌰</div><div class="shadow"></div><div class="sparkles" id="sparkles"></div></section>
  <section class="conversation"><header><div class="bubble-icon">💬</div><div><h2>식물과 소통하기</h2><p>돌보기 액션이나 대화를 통해 성장을 도와주세요.</p></div></header><div class="messages" id="messages"><p>씨앗이 심어졌습니다. 먼저 정성껏 돌봐주세요!</p></div><div class="actions"><button data-action="water">💧 물 주기 (+긍정)</button><button data-action="sun">🌞 햇빛 쬐어주기 (+긍정)</button><button data-action="pet">✋ 쓰다듬기 (+긍정)</button><button class="neg" data-action="ignore">🌫️ 방치하기 (+부정)</button><small>씨앗 단계에서는 위 버튼으로 돌봐주어야 합니다.</small></div></section>
</main><script src="../js/dashboard.js?v=3"></script></body></html>
