<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farmda - 식물 키우고 선물하기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/enhancements.css">
</head>
<body>
  <main class="shell">
    <header class="site-title"><h1>Farmda - 식물 키우고 선물하기</h1></header>
    <section class="showcase"><div class="frame"><i class="tl"></i><i class="br"></i><div class="plant" role="img" aria-label="밝은 배경의 초록 식물"></div><div class="thumbs" aria-label="식물 사진 선택"><button class="active" type="button" data-image="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&amp;fit=crop&amp;w=1600&amp;q=90" aria-label="고무나무 사진 보기"></button><button type="button" data-image="https://images.unsplash.com/photo-1485955900006-10f4d324d411?auto=format&amp;fit=crop&amp;w=1600&amp;q=90" aria-label="화분 식물 사진 보기"></button><button type="button" data-image="https://images.unsplash.com/photo-1459411621453-7b03977f4bfc?auto=format&amp;fit=crop&amp;w=1600&amp;q=90" aria-label="초록 식물 사진 보기"></button></div></div></section>
    <section class="auth"><div class="auth-box"><nav class="tabs"><button class="tab active" data-view="login">로그인</button><button class="tab" data-view="signup">회원가입</button></nav>
      <article class="view active" id="login"><h2>Welcome<br>back.</h2><p class="copy">Farmda에 다시 오신 것을 환영합니다.<br>계정 정보를 입력해 주세요.</p><form id="login-form"><label>EMAIL ADDRESS<input type="email" placeholder="name@example.com" required></label><label>PASSWORD<input type="password" placeholder="••••••••" minlength="6" required></label><div class="options"><label class="check"><input type="checkbox"> 로그인 유지</label><button type="button" class="link">비밀번호 찾기</button></div><button class="submit"><span>로그인하기</span><b>↗</b></button></form><p class="switch">아직 계정이 없나요? <button data-switch="signup">회원가입</button></p></article>
      <article class="view" id="signup"><h2>Join<br>Farmda.</h2><p class="copy">식물을 키우고 선물하기 위한 계정을 만드세요.</p><form id="signup-form"><label>DISPLAY NAME<input type="text" placeholder="이름" required></label><label>EMAIL ADDRESS<input type="email" placeholder="name@example.com" required></label><label>PASSWORD<input type="password" placeholder="6자 이상 입력" minlength="6" required></label><label class="check"><input type="checkbox" required> 이용약관 및 개인정보 처리방침 동의</label><button class="submit"><span>계정 생성하기</span><b>↗</b></button></form><p class="switch">이미 계정이 있나요? <button data-switch="login">로그인</button></p></article>
    </div><footer>FARMDA / GROW AND SHARE</footer></section>
  </main><div class="toast" role="status"></div><script src="../js/script.js"></script>
</body></html>
